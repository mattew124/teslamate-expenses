# Push a tag (v0.1.0, or v0.1.0-rc1 for a candidate) to publish an image.
# Pre-release tags never move :latest; they move the floating :rc tag instead, so an
# installation can follow the candidate channel. The run summary shows the digest to pin.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Nothing is pushed until the image passes this scan: a high or critical vulnerability that
      # has a fix stops the release. The multi-arch build below reuses these layers from the cache.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: teslamate-expenses:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.76.2 image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet teslamate-expenses:scan
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=rc,enable=${{ contains(github.ref_name, '-rc') }}
      # The tag without its leading v (v0.3.0 -> 0.3.0), which the app shows and compares with the releases.
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Digest to test and pin
        run: |
          {
            echo "### Image"
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The release notes the app links to: the tag's changelog entry, then the merged pull requests in groups. A tag with a hyphen (v0.3.0-rc1) is marked a pre-release, which
  # GitHub keeps out of "latest". Runs only once the image is published.
  notes:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) flag=--prerelease ;; *) flag=--latest ;; esac
          # The tag's CHANGELOG.md entry opens the notes (what changed and why it matters, and anything an
          # installer must do); GitHub then appends the merged pull requests in groups (.github/release.yml).
          scripts/changelog-entry.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            --title "$TAG" "$flag"
