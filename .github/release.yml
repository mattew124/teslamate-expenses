# How GitHub groups the pull requests listed in a release's notes (the Release workflow asks for
# generated notes). A pull request lands in the first group whose label it carries, so label each one;
# anything unlabelled appears under "Other changes". Dependabot's pull requests are labelled
# "dependencies" for you.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: New features and improvements
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Build, CI and internal
      labels: [internal]
    - title: Other changes
      labels: ["*"]
