version: 2
updates:
  # Python packages: requirements.txt (the app) and requirements-dev.txt (tests and linters).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  # The Python base image in the Dockerfile, and the browser-test image.
  - package-ecosystem: docker
    directories: [/, /tests/browser]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"

  # Workflow actions, which are pinned to commits (the comment after each pin names the version).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"
