# Mount this into Grafana's provisioning folder, together with the volume the app writes its
# dashboard to (see the README, "Grafana"). Grafana then loads the dashboard by itself, and
# updates it whenever you upgrade the app.
apiVersion: 1
providers:
  - name: expenses
    orgId: 1
    folder: Expenses
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /dashboards-expenses
