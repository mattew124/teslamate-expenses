# The documentation site: Markdown in docs/, published to GitHub Pages by .github/workflows/docs.yml.
[project]
site_name = "teslamate-expenses"
site_description = "Track what your Tesla costs to own, next to TeslaMate."
site_url = "https://mattew124.github.io/teslamate-expenses/"
repo_url = "https://github.com/mattew124/teslamate-expenses"
repo_name = "mattew124/teslamate-expenses"
nav = [
  { "Home" = "index.md" },
  { "Setup" = "setup.md" },
  { "Publishing (Traefik and Cloudflare)" = "publishing.md" },
  { "OneDrive uploads" = "onedrive.md" },
  { "Importing invoices" = "importing.md" },
  { "Dashboard" = "dashboard.md" },
  { "Reference" = "reference.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
