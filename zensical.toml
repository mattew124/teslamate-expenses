# The documentation site: Markdown in docs/, published to GitHub Pages by .github/workflows/docs.yml.
[project]
site_name = "GarageBooks"
site_description = "Track what your Tesla costs to own."
site_url = "https://mattew124.github.io/garagebooks/"
repo_url = "https://github.com/mattew124/garagebooks"
repo_name = "mattew124/garagebooks"
nav = [
  { "Home" = "index.md" },
  { "Setup" = "setup.md" },
  { "Publishing (Traefik and Cloudflare)" = "publishing.md" },
  { "OneDrive uploads" = "onedrive.md" },
  { "Invoice folder on the server" = "local-folder.md" },
  { "Importing invoices" = "importing.md" },
  { "Dashboard" = "dashboard.md" },
  { "Reference" = "reference.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
logo = "assets/icon-64.png"
favicon = "assets/icon-32.png"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
