# Dev stack: the UI and Grafana on their OWN test database, and never on the
# TeslaMate network, so nothing here can touch live data. Drive it with
# scripts/dev.sh, which generates the --env-file. Published on loopback only;
# docker-compose.dev.traefik.yml replaces that with the reverse proxy.
# scripts/dev.sh sets the project name, path and ports per checkout (worktree).
name: teslamate-expenses-dev

services:
  expenses-dev:
    build: .
    # EXPENSES_IMAGE: test a released image rather than this working tree.
    image: ${EXPENSES_IMAGE:-teslamate-expenses:${DEV_TAG:-dev}}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/dev/shm"]
    # As you (scripts/dev.sh sets these), so what the app writes into the invoice folder below is yours
    # to look at and delete.
    user: "${DEV_UID:-10001}:${DEV_GID:-10001}"
    environment:
      DATABASE_HOST: dev-db
      DATABASE_NAME: teslamate
      # Same as the live setup: the TeslaMate database user. The app creates its own schema.
      DATABASE_USER: teslamate
      DATABASE_PASS: ${DEV_ADMIN_DB_PASS:-}
      BASE_PATH: ${DEV_BASE_PATH:-/expenses-dev}
      # OneDrive is on in dev, with a throwaway key from .dev/env; the app
      # registration is entered on its OneDrive page.
      EXPENSES_ENCRYPTION_KEY: ${DEV_ENCRYPTION_KEY:-}
      APP_TZ: ${APP_TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${APP_TZ:-UTC}
      # The app writes its Grafana dashboard here, exactly as in production.
      DASHBOARD_DIR: /dashboards
      # The invoice folder is on in dev too: .dev/invoices in this checkout stands in for a mounted
      # share, so test PDFs can be dropped straight into it. INVOICES_HOST_DIR is only shown on the page.
      INVOICES_DIR: /invoices
      INVOICES_HOST_DIR: ${DEV_INVOICES_SHOWN:-}
    volumes:
      - dev-dashboards:/dashboards
      - type: bind
        source: ${DEV_INVOICES_DIR:-./.dev/invoices}
        target: /invoices
        bind:
          create_host_path: false   # as in production: scripts/dev.sh makes it, Docker never does
    depends_on:
      dev-db:
        condition: service_healthy
      dev-dashboards-owner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${DEV_UI_PORT:-8089}:8080"
    networks: [dev]

  # The dashboard volume belongs to whoever wrote it first (root when new, 10001 from an earlier
  # run), and the app replaces its dashboard file there on every start: hand it to the app's user.
  dev-dashboards-owner:
    image: postgres:18-trixie   # already pulled for dev-db; only its chown is used
    user: root
    network_mode: none
    entrypoint: ["chown", "-R", "${DEV_UID:-10001}:${DEV_GID:-10001}", "/dashboards"]
    volumes:
      - dev-dashboards:/dashboards

  dev-db:
    image: postgres:18-trixie   # same major version as TeslaMate's documented image
    restart: unless-stopped
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_DB: teslamate
      POSTGRES_PASSWORD: ${DEV_ADMIN_DB_PASS:-}
    volumes:
      - dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate -d teslamate"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dev]

  dev-grafana:
    image: teslamate/grafana:latest
    restart: unless-stopped
    environment:
      DATABASE_HOST: dev-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: teslamate
      DATABASE_USER: teslamate
      DATABASE_PASS: ${DEV_ADMIN_DB_PASS:-}
      DATABASE_SSL_MODE: disable
      GF_SECURITY_ADMIN_PASSWORD: ${DEV_GRAFANA_PASS:-}
      GF_SERVER_ROOT_URL: http://localhost:${DEV_GRAFANA_PORT:-8090}${DEV_BASE_PATH:-/expenses-dev}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # View without a Grafana login: this stack is only on loopback or behind
      # the proxy's forward-auth.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /dashboards-dev/cost-of-ownership.json
      TZ: ${APP_TZ:-UTC}
    volumes:
      - ./grafana/provider.dev.yml:/etc/grafana/provisioning/dashboards/expenses-dev.yml:ro
      - dev-dashboards:/dashboards-dev:ro
    depends_on:
      dev-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_GRAFANA_PORT:-8090}:3000"
    networks: [dev]

networks:
  dev:

volumes:
  dev-db:
  dev-dashboards:
